version: 1
policy: review-automation
trust: trusted-automation
source_events:
  - onReviewEnter
  - onDispatchCompleted
  - onReviewVerdict
db:
  read:
    tables:
      - card_review_state
      - kanban_cards
      - kanban_reviews
      - pipeline_stages
      - task_dispatches
  write:
    tables:
      - kanban_cards
  raw_sql:
    mode: legacy
    capabilities:
      - review_lifecycle_legacy_raw_db
    markers_required: false
    rationale: broad legacy review lifecycle DB access pinned by no-silent-growth baseline
    no_silent_growth:
      callsites: 32
      fingerprint: sha256:490f9418486a62b3ee853911304c7182f99f7a1c178e4162d1d7cec991a0d8d5
exec:
  allow:
    - gh
    - git
http:
  loopback_only: true
session:
  kill: false
