version: 1
policy: review-automation
trust: trusted-automation
source_events:
  - onReviewEnter
  - onDispatchCompleted
  - onReviewVerdict
  - onTick5min
db:
  read:
    tables:
      - card_review_state
      - kanban_cards
      - pipeline_stages
      - pr_tracking
      - task_dispatches
  write:
    tables:
      - kanban_cards
      - pr_tracking
  raw_sql:
    mode: legacy
    capabilities:
      - review_lifecycle_legacy_raw_db
    markers_required: false
    rationale: broad legacy review lifecycle DB access pinned by no-silent-growth baseline
    no_silent_growth:
      callsites: 31
      fingerprint: sha256:0e89c142899bda76847bb7c100e43c12cd7ea71bf5d300cae491759754c363c6
exec:
  allow:
    - gh
    - git
http:
  loopback_only: true
session:
  kill: false
